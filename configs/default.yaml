project:
  title: "Gaze-induced tuning changes in mouse V1: gratings versus natural images"
  environment_name: gaze_v1_sim
  random_seed: 42

runtime:
  output_dir: results
  save_intermediate: true
  show_progress: true

cortical_field:
  size_um: 500.0
  n_neurons: 1000

retinotopy:
  center_azimuth_deg: 0.0
  center_elevation_deg: 0.0
  # Degrees per micron. 0.018 deg/um is 18 deg/mm across local cortex.
  matrix_deg_per_um:
    - [0.018, 0.000]
    - [0.000, 0.014]
  rotation_deg: 12.0
  anisotropy:
    azimuth_scale: 1.0
    elevation_scale: 0.85
  jitter_sd_deg:
    azimuth: 1.5
    elevation: 1.5

mapping:
  mode: exact
  error:
    name: perfect
    origin_offset_deg: [0.0, 0.0]
    scale: [1.0, 1.0]
    rotation_deg: 0.0
    anisotropy: [1.0, 1.0]
    nonlinear: 0.0

rf:
  response_model: simple
  theta_distribution: uniform
  spatial_frequency_cpd:
    distribution: lognormal
    median: 0.055
    sigma_log: 0.55
    min: 0.01
    max: 0.25
  sigma_deg:
    distribution: lognormal
    median_x: 2.6
    median_y: 1.3
    sigma_log: 0.25
    min: 0.35
    max: 8.0
  phase_distribution: uniform
  gain:
    distribution: lognormal
    median: 1.0
    sigma_log: 0.25
  baseline: 0.05
  gamma: 1.25
  orientation_bandwidth_deg: 32.0
  sf_bandwidth_octaves: 1.1

stimuli:
  gratings:
    orientations_deg:
      start: 0.0
      stop: 180.0
      step: 10.0
    spatial_frequencies_cpd:
      min: 0.01
      max: 0.20
      count: 8
      spacing: log
    phases_deg: [0.0, 90.0, 180.0, 270.0]
  moving_gratings:
    orientations_deg:
      start: 0.0
      stop: 180.0
      step: 10.0
    spatial_frequencies_cpd:
      min: 0.01
      max: 0.20
      count: 8
      spacing: log
    temporal_frequency_hz: 2.0
    duration_s: 1.0
    time_samples: 16
    phases_deg: [0.0]
  natural_images:
    folder: null
    n_images: 12
    image_size_px: 64
    extent_deg: 40.0
    normalize: zscore
    procedural_seed: 1337

gaze:
  azimuth_deg:
    min: 0.0
    max: 10.0
    step: 0.1
  elevation_deg:
    min: 0.0
    max: 10.0
    step: 0.1
  symmetric: false

noise:
  model: none
  repeats: 1
  gaussian_sd: 0.05
  poisson_scale: 25.0
  gain_sd: 0.10
  clip_nonnegative: true

analysis:
  po_large_shift_threshold_deg: 10.0
  natural_large_change_threshold: 0.5
  bootstrap_samples: 200
  selected_offsets_deg:
    - [0.0, 0.0]
    - [2.0, 2.0]
    - [5.0, 5.0]
    - [10.0, 10.0]

longitudinal:
  n_sessions: 6
  session_interval_weeks: 1.0
  cumulative_gaze_drift_deg_per_week: 1.0
  drift_direction_deg: 45.0
  circuit_drift_scale_relative_to_gaze: 1.0
  circuit_drift:
    azimuth_sd_deg_per_deg: 0.20
    elevation_sd_deg_per_deg: 0.20
    theta_sd_deg_per_deg: 0.75
    log_sf_sd_per_deg: 0.03
    log_gain_sd_per_deg: 0.04
    baseline_sd_per_deg: 0.005
    phase_sd_rad_per_deg: 0.10

debug:
  cortical_field:
    n_neurons: 160
  longitudinal:
    n_sessions: 5
  gaze:
    azimuth_deg:
      min: 0.0
      max: 5.0
      step: 1.0
    elevation_deg:
      min: 0.0
      max: 5.0
      step: 1.0
  stimuli:
    gratings:
      orientations_deg:
        start: 0.0
        stop: 180.0
        step: 20.0
      spatial_frequencies_cpd:
        min: 0.015
        max: 0.18
        count: 5
        spacing: log
      phases_deg: [0.0, 90.0]
    moving_gratings:
      orientations_deg:
        start: 0.0
        stop: 180.0
        step: 20.0
      spatial_frequencies_cpd:
        min: 0.015
        max: 0.18
        count: 5
        spacing: log
      temporal_frequency_hz: 2.0
      duration_s: 1.0
      time_samples: 8
      phases_deg: [0.0]
    natural_images:
      n_images: 8
      image_size_px: 48
  noise:
    repeats: 2
  analysis:
    bootstrap_samples: 50
